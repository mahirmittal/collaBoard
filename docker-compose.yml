services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  server:
    build: ./server
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/synctask}
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - mongo
  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - server
volumes:
  mongo_data:
